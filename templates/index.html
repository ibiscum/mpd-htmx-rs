<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MPD Web Client</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.htmx) {
                return;
            }

            async function applySwap(targetSelector, swap, responseText) {
                if (!targetSelector || swap === "none") {
                    return false;
                }
                const target = document.querySelector(targetSelector);
                if (!target) {
                    return false;
                }
                if (swap === "innerHTML") {
                    target.innerHTML = responseText;
                    return true;
                }
                return false;
            }

            document.addEventListener("click", async (event) => {
                const button = event.target.closest("[hx-get],[hx-post]");
                if (!button || button.closest("form")) {
                    return;
                }
                event.preventDefault();

                const url = button.getAttribute("hx-get") || button.getAttribute("hx-post");
                const method = button.hasAttribute("hx-post") ? "POST" : "GET";
                const swap = button.getAttribute("hx-swap") || "innerHTML";
                const target = button.getAttribute("hx-target");
                const response = await fetch(url, { method });
                const text = await response.text();
                const swapped = await applySwap(target, swap, text);
                if (!swapped && response.ok) {
                    window.location.reload();
                }
            });

            document.addEventListener("submit", async (event) => {
                const form = event.target;
                if (!(form instanceof HTMLFormElement)) {
                    return;
                }
                const hxGet = form.getAttribute("hx-get");
                const hxPost = form.getAttribute("hx-post");
                if (!hxGet && !hxPost) {
                    return;
                }
                event.preventDefault();

                const method = hxPost ? "POST" : "GET";
                const url = hxPost || hxGet;
                const swap = form.getAttribute("hx-swap") || "innerHTML";
                const target = form.getAttribute("hx-target");
                const formData = new FormData(form);
                const request = method === "POST"
                    ? fetch(url, { method, body: formData })
                    : fetch(`${url}?${new URLSearchParams(formData).toString()}`, { method });

                const response = await request;
                const text = await response.text();
                const swapped = await applySwap(target, swap, text);
                if (!swapped && response.ok) {
                    window.location.reload();
                }
            });
        });
    </script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1117;
            --panel: #161b22;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #2f81f7;
            --active: #238636;
            --danger: #da3633;
            --border: #30363d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .layout {
            max-width: 960px;
            margin: 0 auto;
            padding: 1rem;
        }
        button {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.45rem 0.7rem;
            font: inherit;
        }
        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="layout">
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
            <button hx-get="/tab/player" hx-target="#tab-content" hx-swap="innerHTML">Player</button>
            <button hx-get="/tab/library" hx-target="#tab-content" hx-swap="innerHTML">Library</button>
            <button hx-get="/tab/playlists" hx-target="#tab-content" hx-swap="innerHTML">Playlists</button>
            <button hx-get="/tab/search" hx-target="#tab-content" hx-swap="innerHTML">Search</button>
        </div>
        <div id="tab-content">
            {{ initial_tab_html|safe }}
        </div>
    </div>
</body>
</html>
